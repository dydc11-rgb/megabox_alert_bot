name: Telegram Test

on:
  workflow_dispatch:

jobs:
  telegram-test:
    runs-on: ubuntu-latest

    steps:
      - name: Find Telegram chat ID
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          RESPONSE=$(curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates")
          echo "$RESPONSE"

          CHAT_ID=$(echo "$RESPONSE" | jq -r '.result[-1].message.chat.id')

          if [ "$CHAT_ID" = "null" ] || [ -z "$CHAT_ID" ]; then
            echo "Telegram chat ID를 찾지 못했습니다."
            exit 1
          fi

          echo "CHAT_ID=$CHAT_ID" >> "$GITHUB_ENV"

      - name: Send test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            --data-urlencode "text=🎬 메가박스 예매 알림봇 테스트 성공! GitHub와 Telegram 연결이 정상적으로 완료되었습니다."
